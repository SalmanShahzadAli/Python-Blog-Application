{% extends 'base.html' %}
{% load i18n %}
{% block title %}Sign In{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body text-center">
                <h2 class="card-title mb-3">Sign In Via {{ account.get_provider.name }}</h2>
                <p class="text-muted">You are about to sign in using a third-party account from {{ account.get_provider.name }}.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-primary w-100">Continue</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
