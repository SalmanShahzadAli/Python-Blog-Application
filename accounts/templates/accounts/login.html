{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title mb-4">Login</h2>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="{{ form.username.id_for_label }}" class="form-label">Email</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label for="{{ form.password.id_for_label }}" class="form-label">Password</label>
                        {{ form.password }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>

                <div class="text-center my-3 text-muted">or</div>

                <div class="d-grid gap-2">
                    <a href="{% url 'google_login' %}" class="btn btn-outline-danger">Login with Google</a>
                    <a href="{% url 'facebook_login' %}" class="btn btn-outline-primary">Login with Facebook</a>
                </div>

                <p class="mt-3 mb-0">Don't have an account? <a href="{% url 'accounts:register' %}">Register</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
