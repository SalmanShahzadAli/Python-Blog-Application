{% extends 'base.html' %}
{% block title %}Delete Product{% endblock %}

{% block content %}
<h1>Delete "{{ product.name }}"?</h1>
<p class="text-muted">This action cannot be undone.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete it</button>
    <a href="{% url 'store:product_detail' product.pk %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
